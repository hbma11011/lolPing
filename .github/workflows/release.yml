name: Release

# Builds the Windows installer and publishes it as a release of this repository, tagged v<package.json version>.
# Start it from the Actions tab ("Run workflow"), or push a matching tag. Installed copies update from this repository's releases.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check a pushed tag matches package.json
        if: github.ref_type == 'tag'
        run: test "${{ steps.tag.outputs.tag }}" = "$GITHUB_REF_NAME"
      # A draft until the installer and latest.yml are attached, so installed copies never see a release without them.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -Fx "$TAG" > /dev/null \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "lolPing $TAG" --generate-notes --draft

  windows:
    needs: release
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      # Read by package.json's publish settings: installed copies look for updates in this repository.
      LOLPING_OWNER: ${{ github.repository_owner }}
      LOLPING_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:helper
      - run: npm test
      - run: npm run dist
      - name: Upload the installer and its update files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "release/lolPing-Setup-${TAG#v}.exe" \
            "release/latest.yml" \
            "release/lolPing-Setup-${TAG#v}.exe.blockmap" \
            --clobber

  publish:
    needs: [release, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release.outputs.tag }}" --draft=false --latest
